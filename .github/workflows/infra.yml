name: infra

on:
  pull_request:
    paths: ["infra/terraform/platform/**", "infra/terraform/app/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/terraform/platform/**", "infra/terraform/app/**", ".github/workflows/infra.yml"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::762197749808:role/gha-deploy
  PIPELINE_ROLE_ARN: arn:aws:iam::762197749808:role/pipeline-runner
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    shell: bash

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [platform, app]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.2
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [platform, app]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.2
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform test
      # no saved plan file (it would carry the organizer secret in plaintext); main re-plans at apply
      - run: terraform apply -input=false -auto-approve -lock-timeout=5m
      - if: matrix.stack == 'platform'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.PIPELINE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - if: matrix.stack == 'platform'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Smoke test
        if: matrix.stack == 'platform'
        working-directory: .
        env:
          SNOWFLAKE_ACCOUNT: RLQHFPF-AXC97788
          SNOWFLAKE_USER: PIPELINE_SVC
          SNOWFLAKE_ROLE: PIPELINE_ROLE
          SNOWFLAKE_WAREHOUSE: WH_PIPELINE
          SNOWFLAKE_DATABASE: LATAM_BANK
          SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: AWS
        run: uv run pytest -m snowflake tests/test_infra_smoke.py -q
