name: pipeline

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths: ["pipeline/**", "dbt/**", "infra/snowflake/**", ".github/workflows/pipeline.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# PIPELINE_SVC via AWS workload identity (role pipeline-runner); no stored secret anywhere.
env:
  SNOWFLAKE_ACCOUNT: RLQHFPF-AXC97788
  SNOWFLAKE_USER: PIPELINE_SVC
  SNOWFLAKE_ROLE: PIPELINE_ROLE
  SNOWFLAKE_WAREHOUSE: WH_PIPELINE
  SNOWFLAKE_DATABASE: LATAM_BANK
  SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: AWS
  DBT_PROFILES_DIR: dbt
  ORGANIZER_STAGE_URL: s3://factored-datathon-2026-s3-157725502942-us-east-2-an/data/
  RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::762197749808:role/pipeline-runner
          aws-region: us-east-1
          role-duration-seconds: 3600
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - run: uv run python -m pipeline.setup 02_raw_tables.sql
      - run: uv run python -m pipeline.load --run-id "$RUN_ID" --stage-url-prefix "$ORGANIZER_STAGE_URL"
      - run: uv run dbt source freshness --project-dir dbt --target ci || true # freshness does not gate (the organizer drop is static)
      - run: uv run dbt build --project-dir dbt --target ci
      - if: always() && hashFiles('dbt/target/run_results.json') != ''
        run: uv run python -m pipeline.dq_results --run-id "$RUN_ID"
      - run: uv run python -m pipeline.export --run-id "$RUN_ID"
      - name: Keep the dbt lineage (manifest, run results) with the run
        if: always() && hashFiles('dbt/target/run_results.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dbt-lineage-${{ env.RUN_ID }}
          path: |
            dbt/target/manifest.json
            dbt/target/run_results.json
          retention-days: 90
