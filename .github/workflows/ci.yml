name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - run: uv run pytest -m "not snowflake" -q

  # main only: pipeline-runner never reaches PR code.
  fixture:
    needs: unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: fixture
      cancel-in-progress: false
    env:
      SNOWFLAKE_ACCOUNT: RLQHFPF-AXC97788
      SNOWFLAKE_USER: PIPELINE_SVC
      SNOWFLAKE_ROLE: PIPELINE_ROLE
      SNOWFLAKE_WAREHOUSE: WH_PIPELINE
      SNOWFLAKE_DATABASE: LATAM_FIXTURE
      SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: AWS
      DBT_FIXTURE_TARGET: ci_fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::762197749808:role/pipeline-runner
          aws-region: us-east-1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - run: SETUP_DATABASE=LATAM_FIXTURE uv run python -m pipeline.setup 02_raw_tables.sql
      - run: uv run pytest tests/test_fixture_drop.py -m snowflake -q
